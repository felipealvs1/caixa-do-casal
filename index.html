<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A1729"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Caixa do Casal"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A1729'/%3E%3Cpath d='M42 22a14 14 0 1 0 0 20' fill='none' stroke='%23C9A96E' stroke-width='3'/%3E%3C/svg%3E"></head><body><title>Caixa do Casal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">
<style>
/* Layout: cabeçalho fixo (mês + visão casal/individual); conteúdo em coluna única no celular e duas colunas no desktop; navegação inferior no celular, abas no cabeçalho no desktop. */
:root{
  --bg:#F4F1E8; --surface:#FFFDF7; --surface-2:#EAE5D7; --ink:#0A1729; --ink-2:#11294A;
  --muted:#566377; --line:#DCD5C4; --hair:#C9A96E; --num:#8A6B33;
  --c1:#0A1729; --c2:#4A6081; --c3:#97A3B4;
  --bad:#A3412C; --warn:#94650F; --good:#2E6A52;
  --bad-bg:rgba(163,65,44,.08); --warn-bg:rgba(148,101,15,.09); --good-bg:rgba(46,106,82,.08);
  --scrim:rgba(10,23,41,.42); --shadow:0 18px 50px rgba(10,23,41,.18);
  --f-display:'Spectral',Georgia,'Times New Roman',serif;
  --f-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1729; --surface:#11294A; --surface-2:#0D213D; --ink:#F4F1E8; --ink-2:#DCE2EA;
  --muted:#97A3B4; --line:#233B5E; --hair:#C9A96E; --num:#C9A96E;
  --c1:#F4F1E8; --c2:#97A3B4; --c3:#4F6687;
  --bad:#E58A72; --warn:#E3B661; --good:#7DC2A3;
  --bad-bg:rgba(229,138,114,.10); --warn-bg:rgba(227,182,97,.10); --good-bg:rgba(125,194,163,.10);
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1729; --surface:#11294A; --surface-2:#0D213D; --ink:#F4F1E8; --ink-2:#DCE2EA;
  --muted:#97A3B4; --line:#233B5E; --hair:#C9A96E; --num:#C9A96E;
  --c1:#F4F1E8; --c2:#97A3B4; --c3:#4F6687;
  --bad:#E58A72; --warn:#E3B661; --good:#7DC2A3;
  --bad-bg:rgba(229,138,114,.10); --warn-bg:rgba(227,182,97,.10); --good-bg:rgba(125,194,163,.10);
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hair);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-ui);font-stretch:125%;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--hair)}
.top-in{max-width:1080px;margin:0 auto;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:400;white-space:nowrap}
.brand i{font-weight:300;color:var(--muted)}
.tabs-d{display:none;justify-content:center;gap:4px}
.tabs-d button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:500}
.tabs-d button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.month{display:flex;align-items:center;gap:2px;justify-self:end}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted);display:grid;place-items:center}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month .lbl{font-family:var(--f-num);font-size:14px;min-width:78px;text-align:center}
.month .tema{margin-left:6px;width:40px;height:40px;border:1px solid var(--line)}
.month .tema svg{width:18px;height:18px}
.viewrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,23,41,.12)}
.sync{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.sync.local::before{background:var(--warn)}

/* Conteúdo */
main{max-width:1080px;margin:0 auto;padding-block:20px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.grid2{display:grid;gap:22px;grid-template-columns:1fr}
.grid2>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec{display:grid;gap:12px;align-content:start}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--num);font-size:13px;font-weight:500;padding:0}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--hair);border-radius:var(--r);padding:12px 14px;font-size:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--bg)}

/* Resumo */
.hero{display:grid;gap:18px;grid-template-columns:1fr}
.hero-main .big{font-family:var(--f-num);font-weight:500;font-size:clamp(34px,8vw,48px);line-height:1.05;color:var(--num);font-variant-numeric:tabular-nums}
.hero-main .big.neg{color:var(--bad)}
.hero-main .sub{font-size:14px;color:var(--muted);margin-top:4px}
.hero-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .v{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted)}
.meter{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.meter span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink);font-family:var(--f-num);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.dot.c1{background:var(--c1)} .dot.c2{background:var(--c2)} .dot.c3{background:var(--c3)}
.dot.sb{background:none;border:1.5px solid var(--good)}
.dot.rd{background:var(--hair);height:2px;width:14px;vertical-align:middle}

.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 14px 12px 0;border-radius:10px;background:var(--surface)}
.alert::before{content:"";border-radius:0 3px 3px 0}
.alert.critico{background:var(--bad-bg)} .alert.critico::before{background:var(--bad)}
.alert.atencao{background:var(--warn-bg)} .alert.atencao::before{background:var(--warn)}
.alert.ok{background:var(--good-bg)} .alert.ok::before{background:var(--good)}
.alert .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert .x{font-size:13.5px;color:var(--muted);margin-top:2px}
.pill{font-family:var(--f-ui);font-stretch:125%;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.pill.critico{color:var(--bad)} .pill.atencao{color:var(--warn)} .pill.ok{color:var(--good)} .pill.neutro{color:var(--muted)}

.cats{display:grid;gap:12px}
.cat .top-l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cat .top-l .num{font-size:13.5px}
.cat .bar{height:6px;background:var(--surface-2);border-radius:999px;margin-top:6px;position:relative}
.cat .bar span{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c2)}
.cat .bar span.over{background:var(--warn)}
.cat .meta{font-size:12px;color:var(--muted);margin-top:3px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .p{padding:12px;border-radius:10px;background:var(--surface-2);min-width:0}
.split .p .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px}
.kv .num{font-size:13px}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px;padding-top:4px}
.spark div{flex:1;border-radius:3px 3px 0 0;background:var(--c3);min-height:2px;position:relative}
.spark div.neg{background:var(--bad);border-radius:0 0 3px 3px;align-self:flex-start}
.spark-wrap{display:grid;grid-template-rows:auto 1px auto}
.spark-axis{background:var(--line)}
.spark-neg{display:flex;gap:4px;height:28px;align-items:flex-start}
.spark-neg div{flex:1;background:var(--bad);border-radius:0 0 3px 3px}
.spark-lbl{display:flex;gap:4px;font-family:var(--f-num);font-size:10px;color:var(--muted);margin-top:4px}
.spark-lbl span{flex:1;text-align:center}

.ends{display:grid;gap:8px}
.end{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.end:last-child{border-bottom:0;padding-bottom:0}

/* Lançamentos */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .d{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .v{text-align:right;font-family:var(--f-num);font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{display:block;font-size:11.5px;color:var(--muted)}
.row.off{opacity:.55}
.prog{display:inline-block;width:46px;height:4px;background:var(--surface-2);border-radius:999px;vertical-align:middle;margin-left:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c2)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--muted)}
.total .num{color:var(--ink);font-size:16px}

/* Projeção */
.chart-box{overflow-x:auto}
.chart-box svg{display:block}
.chart-box text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--f-ui);font-stretch:125%;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;font-weight:500;color:var(--muted)}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.neg{color:var(--bad)}
tr:last-child td{border-bottom:0}
tr.cur td{background:var(--surface-2)}

/* Análise */
.sug{display:grid;gap:10px}
.sug-i{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sug-i .t{font-weight:600;font-size:14.5px}
.sug-i .x{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.sug-i .e{font-family:var(--f-num);font-size:13px;color:var(--good);white-space:nowrap}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-num);color:var(--num);border:1px solid var(--hair);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.steps li.done::before{content:"✓"}
.steps .t{font-weight:600;font-size:14.5px}
.steps .x{font-size:13.5px;color:var(--muted)}
.res-meter{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.res-meter i{display:block;height:100%;background:var(--good)}
.sim{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sim div{padding:10px;border-radius:10px;background:var(--surface-2);min-width:0}
.sim .y{font-size:12px;color:var(--muted)}
.sim .v{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sim .i{font-size:11.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* Formulários */
.field{display:grid;gap:5px}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.inp:focus{border-color:var(--ink);outline:none}
.inp.money{font-family:var(--f-num)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f2>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.err{font-size:13px;color:var(--bad)}
.settings{display:grid;gap:18px}

/* Navegação inferior + botão */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom button{border:0;background:none;height:var(--nav-h);display:grid;place-items:center;align-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--ink)}
.bottom button[aria-current="page"] svg{stroke:var(--num)}
.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 20px;font-weight:600;font-size:15px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.fab span{font-size:20px;line-height:1;font-weight:400}

/* Folha (modal) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet form{display:grid;gap:14px;max-width:560px;margin:0 auto}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .close{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.sheet .seg{width:100%}
.sheet .seg button{flex:1;max-width:none}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px}
.actions .btn{padding:11px 22px}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (min-width:860px){
  .top-in{grid-template-columns:auto 1fr auto}
  .tabs-d{display:flex}
  .bottom{display:none}
  main{padding-bottom:110px}
  .fab{bottom:28px;right:max(28px,calc(env(safe-area-inset-right,0px) + 28px))}
  .toast{bottom:96px}
  .grid2{grid-template-columns:1.25fr 1fr;align-items:start}
  .hero{grid-template-columns:1.1fr 1fr;align-items:end}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 48px));border-radius:20px;padding:22px 26px}
  .sheet .grab{display:none}
}
@media (max-width:520px){
  .sim{grid-template-columns:1fr 1fr}
  .brand{font-size:20px}
  .month .lbl{min-width:70px}
}
@media (prefers-reduced-motion:no-preference){
  .sheet:not([hidden]){animation:up .22s ease-out}
  @keyframes up{from{opacity:.4;translate:0 24px}to{opacity:1;translate:0 0}}
}
</style>

<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<button class="fab" id="fab" type="button" data-act="add"><span>+</span> Lançar</button>
<nav class="bottom" id="bottom" aria-label="Seções"></nav>
<div class="scrim" id="scrim" data-act="sheet-close" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- Constantes ---------- */
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
// ref = teto de referência como fração da renda (orientação geral, editável no código)
const CATS=[
  {id:'moradia',nome:'Moradia',grupo:'essencial',ref:.30},
  {id:'mercado',nome:'Mercado',grupo:'essencial',ref:.15},

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>(v<0?'−':'')+'R$ '+Math.round(Math.abs(v)).toLocaleString('pt-BR');
const pct=v=>(isFinite(v)?Math.round(v*100):0)+'%';
function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
// cfg.inicio: primeiro mês acompanhado; antes dele o app não mostra nem calcula nada
function inicioApp(){return isExemplo()?'':okMonth(S.cfg.inicio)?S.cfg.inicio:''}
function mesBase(){const i=inicioApp();return i&&mDiff(curMonth(),i)>0?i:curMonth()}
function clampMes(){const i=inicioApp();if(i&&mDiff(S.mes,i)>0)S.mes=i}
function mDiff(a,b){const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)}
function addM(m,n){const[y,mo]=m.split('-').map(Number);const t=y*12+(mo-1)+n;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')}
function mLabel(m){const[y,mo]=m.split('-');return MESES[+mo-1]+'/'+y}
function mShort(m){const[y,mo]=m.split('-');return MESES[+mo-1]+'/'+y.slice(2)}
function mLong(m){const[y,mo]=m.split('-');return MESES_L[+mo-1]+' de '+y}
function okMonth(m){return /^\d{4}-\d{2}$/.test(m||'')}
function parseValor(s){if(typeof s==='number')return s;s=String(s||'').replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN}
function fmtValor(v){return (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}

/* ---------- Dados e cálculos ---------- */
const isExemplo=()=>!S.exemploOff&&!S.rendas.length&&!S.gastos.length;
const D=()=>isExemplo()?EXEMPLO:{cfg:S.cfg,rendas:S.rendas,gastos:S.gastos};
function nome(p,d=D()){if(p==='casal')return 'Casal';const n=d.cfg[p==='a'?'nomeA':'nomeB'];return n||(p==='a'?'Pessoa A':'Pessoa B')}
function rendaAtiva(r,m){if(r.tipo==='extra')return r.inicio===m;return mDiff(r.inicio,m)>=0&&(!r.fim||mDiff(m,r.fim)>=0)}
function gastoAtivo(g,m){
  if(g.observacao)return null; // em observação: fica visível, mas fora das contas
  if(g.tipo==='unico')return g.inicio===m?{}:null;
  const d=mDiff(g.inicio,m);if(d<0)return null;
  if(g.tipo==='parcelado')return d<g.parcelas?{n:d+1}:null;
  return(!g.fim||mDiff(m,g.fim)>=0)?{}:null;
}
function fimParcelas(g){return addM(g.inicio,g.parcelas-1)}
function rendaDe(p,m,d){return d.rendas.filter(r=>r.pessoa===p&&rendaAtiva(r,m)).reduce((s,r)=>s+(+r.valor||0),0)}
function fracao(p,m,d){if(d.cfg.divisao==='igual')return .5;const a=rendaDe('a',m,d),b=rendaDe('b',m,d);if(!(a+b))return .5;return(p==='a'?a:b)/(a+b)}
function parte(g,view,m,d){if(view==='casal'||g.pessoa===view)return 1;if(g.pessoa==='casal')return fracao(view,m,d);return 0}
function mes(m,view=S.view,d=D()){
  const r={m,renda:0,rendaExtra:0,fixos:0,parcelas:0,unicos:0,gastos:0,cats:{},itens:[],essBase:0};
  for(const x of d.rendas){if(!rendaAtiva(x,m)||(view!=='casal'&&x.pessoa!==view))continue;r.renda+=+x.valor;if(x.tipo==='extra')r.rendaExtra+=+x.valor}
  for(const g of d.gastos){
    const a=gastoAtivo(g,m);if(!a)continue;const f=parte(g,view,m,d);if(!f)continue;const v=g.valor*f;
    r[g.tipo==='fixo'?'fixos':g.tipo==='parcelado'?'parcelas':'unicos']+=v;r.gastos+=v;
    r.cats[g.categoria]=(r.cats[g.categoria]||0)+v;
    if(g.tipo!=='unico'&&(CAT[g.categoria]?.grupo==='essencial'||g.tipo==='parcelado'))r.essBase+=v;
    r.itens.push({g,v,f,n:a.n});
  }
  r.sobra=r.renda-r.gastos;return r;
}
const proj=(n=12,view=S.view)=>Array.from({length:n},(_,k)=>mes(addM(S.mes,k),view));

function alertas(){
  const d=D(),r=mes(S.mes),out=[];
  if(!r.renda&&!r.gastos)return[{nivel:'neutro',titulo:'Sem lançamentos neste mês',texto:'Cadastre rendas e gastos para ver os alertas.'}];
  if(!r.renda)out.push({nivel:'critico',titulo:'Nenhuma renda neste mês',texto:'Há gastos lançados, mas nenhuma renda cadastrada para '+mLong(S.mes)+'.'});
  else if(r.sobra<0)out.push({nivel:'critico',titulo:'Gastos acima da renda',texto:`Faltam ${brl0(-r.sobra)} para fechar ${mLong(S.mes)}.`});
  else if(r.gastos/r.renda>.9)out.push({nivel:'atencao',titulo:'Renda quase toda comprometida',texto:`${pct(r.gastos/r.renda)} da renda já tem destino. Qualquer imprevisto vira dívida.`});
  else if(r.sobra/r.renda<.1)out.push({nivel:'atencao',titulo:'Sobra abaixo de 10% da renda',texto:`Sobram ${brl0(r.sobra)} (${pct(r.sobra/r.renda)}). O ideal é guardar ao menos 20%.`});
  if(r.renda){
    const pp=r.parcelas/r.renda;
    if(pp>.3)out.push({nivel:'critico',titulo:'Parcelas pesando demais',texto:`Parcelas ocupam ${pct(pp)} da renda (${brl0(r.parcelas)}). Acima de 30% o risco de aperto é alto.`});
    else if(pp>.2)out.push({nivel:'atencao',titulo:'Parcelas acima de 20% da renda',texto:`${brl0(r.parcelas)} por mês em parcelas, ${pct(pp)} da renda.`});
    const rig=(r.fixos+r.parcelas)/r.renda;
    if(rig>.7)out.push({nivel:'atencao',titulo:'Orçamento pouco flexível',texto:`Fixos e parcelas somam ${pct(rig)} da renda, o que deixa pouca margem para cortes rápidos.`});
    if(r.rendaExtra>0&&r.renda-r.rendaExtra<r.gastos)out.push({nivel:'atencao',titulo:'Mês depende de renda extra',texto:`Sem os ${brl0(r.rendaExtra)} extras, o mês fecharia ${brl0(r.renda-r.rendaExtra-r.gastos)}.`});
  }
  for(let k=1;k<12;k++){
    const m=addM(S.mes,k),p=mes(m);
    if(p.sobra<0){
      const big=p.itens.filter(i=>i.g.tipo==='unico').sort((a,b)=>b.v-a.v)[0];
      out.push({nivel:'critico',titulo:`Mês no vermelho em ${mLabel(m)}`,texto:`Os gastos previstos superam a renda em ${brl0(-p.sobra)}`+(big?`, puxados por ${big.g.descricao} (${brl0(big.v)}).`:'.')});
      break;
    }
  }
  const base=mes(S.mes,'casal').essBase,res=+d.cfg.reserva||0,meses=+d.cfg.mesesReserva||6;
  if(base>0){
    const cob=res/base;
    if(cob<3)out.push({nivel:'critico',titulo:'Reserva de emergência curta',texto:`A reserva cobre ${cob.toFixed(1).replace('.',',')} meses de custos essenciais. A meta é ${meses} meses (${brl0(base*meses)}).`});
    else if(cob<meses)out.push({nivel:'atencao',titulo:'Reserva ainda incompleta',texto:`Cobre ${cob.toFixed(1).replace('.',',')} de ${meses} meses. Faltam ${brl0(base*meses-res)}.`});
  }
  if(S.view==='casal')for(const p of['a','b']){
    const pm=mes(S.mes,p);
    if(pm.renda>0&&pm.sobra<0)out.push({nivel:'atencao',titulo:`${nome(p)} fecha o mês no negativo`,texto:`Pela divisão atual, a parte de ${nome(p)} nos gastos (${brl0(pm.gastos)}) passa da própria renda (${brl0(pm.renda)}).`});
  }
  if(!out.length)out.push({nivel:'ok',titulo:'Orçamento equilibrado',texto:`Sobra de ${pct(r.sobra/r.renda)} da renda e nenhum risco previsto nos próximos 12 meses.`});
  const ord={critico:0,atencao:1,ok:2,neutro:3};return out.sort((a,b)=>ord[a.nivel]-ord[b.nivel]);
}

function sugestoes(){
  const r=mes(S.mes),out=[],usadas=new Set();
  if(!r.gastos)return out;
  if(r.renda)for(const[cid,v]of Object.entries(r.cats)){
    const c=CAT[cid];if(!c?.ref)continue;const lim=c.ref*r.renda;
    if(v>lim*1.05){usadas.add(cid);out.push({titulo:`${c.nome} acima da referência`,texto:`${brl0(v)} por mês, ${pct(v/r.renda)} da renda. Referência: até ${pct(c.ref)} (${brl0(lim)}).`,eco:v-lim})}
  }
  Object.entries(r.cats).filter(([c])=>CAT[c]?.grupo==='estilo'&&!usadas.has(c)&&c!=='assinaturas').sort((a,b)=>b[1]-a[1]).slice(0,3)
    .forEach(([cid,v])=>out.push({titulo:`Reduzir ${CAT[cid].nome.toLowerCase()} em 20%`,texto:`Hoje ${brl0(v)} por mês. Cortar 20% libera ${brl0(v*.2)} por mês, ${brl0(v*.2*12)} em um ano.`,eco:v*.2}));
  const ass=r.itens.filter(i=>i.g.categoria==='assinaturas');
  if(ass.length){const t=ass.reduce((s,i)=>s+i.v,0);out.push({titulo:'Revisar assinaturas',texto:`${ass.map(i=>i.g.descricao).join(', ')} somam ${brl0(t)} por mês. Cancelem as que ninguém usou nos últimos 30 dias.`,eco:t*.4})}
  if(r.renda&&r.parcelas/r.renda>.15){
    const fim=r.itens.filter(i=>i.g.tipo==='parcelado').map(i=>fimParcelas(i.g)).sort().pop();
    out.push({titulo:'Segurar novas compras parceladas',texto:`As parcelas já ocupam ${pct(r.parcelas/r.renda)} da renda. A última termina em ${mLabel(fim)}; novas parcelas até lá apertam a sobra.`,eco:0});
  }
  const d=D();
  for(let k=1;k<=6;k++){
    const m=addM(S.mes,k);
    for(const g of d.gastos){
      if(g.observacao||g.tipo!=='unico'||g.inicio!==m)continue;const v=g.valor*parte(g,S.view,m,d);
      if(v<Math.max(300,r.renda*.05))continue;
      out.push({titulo:`Provisionar ${g.descricao}`,texto:`${brl0(v)} em ${mLabel(m)}. Guardar ${brl0(v/(k+1))} por mês desde já evita aperto quando chegar.`,eco:0,prov:true});
    }
  }
  return out.sort((a,b)=>b.eco-a.eco);
}

const mqEscuro=matchMedia('(prefers-color-scheme: dark)');
function temaAtual(){return S.tema||(mqEscuro.matches?'escuro':'claro')}
function aplicarTema(){if(S.tema)document.documentElement.dataset.theme=S.tema==='escuro'?'dark':'light';else delete document.documentElement.dataset.theme}

function loadLocal(){const x=lsGet(LS_DATA);if(x){S.cfg={...DEF_CFG,...(x.cfg||{})};S.rendas=x.rendas||[];S.gastos=x.gastos||[]}}
function saveLocal(){lsSet(LS_DATA,{cfg:S.cfg,rendas:S.rendas,gastos:S.gastos})}

async function boot(){
  loadPrefs();
  if(PLANILHA_URL){S.modo='planilha';loadLocal();render();iniciarPlanilha();return}
  render();
  let db=null;
  try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db')}catch(e){db=null}
  if(db){store.db=db;S.modo='nuvem';subscribe()}
  else{S.modo='local';loadLocal();S.carregado=true;render()}
}
function subscribe(){
  const db=store.db;let n=0;const ready=()=>{if(++n>=3){S.carregado=true}};
  const onErr=e=>{if(e&&e.code==='revoked')return;toast('Não foi possível sincronizar agora. Recarregue a página.')};
  let r1=false,r2=false,r3=false;
  db.collection('rendas').onSnapshot(s=>{S.rendas=s.docs.map(x=>({id:x.id,...x.data()}));if(!r1){r1=true;ready()}schedule()},onErr);
  db.collection('gastos').onSnapshot(s=>{S.gastos=s.docs.map(x=>({id:x.id,...x.data()}));if(!r2){r2=true;ready()}schedule()},onErr);
  db.doc('config/casal').onSnapshot(s=>{S.cfg={...DEF_CFG,...(s.exists?s.data():{})};if(!r3){r3=true;ready()}schedule()},onErr);
}
let rafId=0;function schedule(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(render)}

/* ---------- Planilha do Google ---------- */
const plan={senha:lsGet(LS_SENHA)||'',pend:0,timer:0};
async function api(acao,extra={}){
  let r,x;
  // sem cabeçalho Content-Type: o pedido vai como texto simples e o Apps Script aceita sem pré-verificação
  try{r=await fetch(PLANILHA_URL,{method:'POST',body:JSON.stringify({senha:plan.senha,acao,...extra})});x=await r.json()}
  catch(e){throw{code:'rede'}}
  if(!x||!x.ok)throw{code:(x&&x.erro)||'erro'};
  return x;
}
function aplicar(x){
  if(plan.pend)return;
  S.rendas=x.rendas||[];S.gastos=x.gastos||[];S.cfg={...DEF_CFG,...(x.cfg||{})};
  S.carregado=true;S.offline=false;saveLocal();schedule();
}
async function atualizarPlanilha(){
  if(!plan.senha||plan.pend||document.hidden)return;
  try{aplicar(await api('ler'))}
  catch(e){if(e.code==='senha'){sairPlanilha();toast('A senha mudou. Entre de novo.')}else if(!S.offline){S.offline=true;renderTop()}}
}
function iniciarPlanilha(){
  if(!plan.senha){S.precisaSenha=true;render();return}
  atualizarPlanilha();
  clearInterval(plan.timer);plan.timer=setInterval(atualizarPlanilha,20000);
}
async function entrarPlanilha(senha){
  plan.senha=senha;S.loginErr='';
  try{const x=await api('ler');lsSet(LS_SENHA,senha);S.precisaSenha=false;aplicar(x);iniciarPlanilha()}
  catch(e){
    plan.senha='';
    S.loginErr=e.code==='senha'?'Senha incorreta.':e.code==='sem_senha'?'A senha ainda não foi definida no script da planilha.':'Não foi possível falar com a planilha. Confira a internet e o endereço no código.';
    render();
  }
}

function falha(e){
  if(e&&e.code==='rede')toast('Sem conexão com a planilha. Nada foi salvo; tente de novo.');
  else if(e&&e.code==='senha')toast('Senha incorreta. Entre de novo.');
  else if(e&&e.code==='invalid_argument')toast('Seu acesso a esta página é só de leitura.');
  else if(e&&e.code==='quota_exceeded')toast('Limite de armazenamento atingido. Apague lançamentos antigos.');
  else toast('Não foi possível salvar. Verifique a conexão e tente de novo.');
}
async function gravar(col,obj){
  const id=obj.id||uid();const body={...obj,atualizadoEm:Date.now()};delete body.id;
  if(S.modo==='planilha'){
    const item={id,...body},arr=S[col],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=item;else arr.push(item);render();
    await escrever('gravar',{col,item});
  }
  else if(store.db){await store.db.collection(col).doc(id).set(body)}
  else{const arr=S[col];const i=arr.findIndex(x=>x.id===id);const item={id,...body};if(i>=0)arr[i]=item;else arr.push(item);saveLocal();render()}
}
async function remover(col,id){
  if(S.modo==='planilha'){S[col]=S[col].filter(x=>x.id!==id);render();await escrever('remover',{col,id})}
  else if(store.db){await store.db.collection(col).doc(id).delete()}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render()}
}
let cfgTimer=0;
function salvarCfg(){
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(async()=>{
    if(S.modo==='planilha'){try{await escrever('cfg',{cfg:{...S.cfg}})}catch(e){falha(e)}}
    else if(store.db){try{await store.db.doc('config/casal').set({...S.cfg})}catch(e){falha(e)}}
    else{saveLocal()}
  },350);
  render();
}

function descTipo(g){
  if(g.observacao)return 'em observação · fora das contas'+(g.tipo==='parcelado'?` · ${g.parcelas}x`:'');
  if(g.tipo==='parcelado'){const a=gastoAtivo(g,S.mes);const fim=fimParcelas(g);

    return mDiff(S.mes,g.inicio)>0?`${g.parcelas}x a partir de ${mShort(g.inicio)}`:`${g.parcelas}x · terminou em ${mShort(fim)}`}
  if(g.tipo==='unico')return 'único em '+mShort(g.inicio);
  return 'mensal'+(g.fim?' até '+mShort(g.fim):'');
}
function statusPill(it,ativo){

function viewLanc(){
  const d=D(),isG=S.lanc==='gastos';
  let itens=(isG?d.gastos:d.rendas).filter(x=>S.view==='casal'||x.pessoa===S.view||(isG&&x.pessoa==='casal'));
  const temObs=isG&&itens.some(x=>x.observacao);
  const filtros=isG?[['mes','Do mês'],['fixo','Fixos'],['parcelado','Parcelados'],['unico','Únicos'],...(temObs?[['obs','Em observação']]:[])]:[['mes','Do mês'],['fixa','Fixas'],['extra','Extras']];
  if(!filtros.some(f=>f[0]===S.filtro))S.filtro='mes';
  const ativo=x=>isG?!!gastoAtivo(x,S.mes):rendaAtiva(x,S.mes);
  itens=S.filtro==='mes'?itens.filter(ativo):S.filtro==='obs'?itens.filter(x=>x.observacao):itens.filter(x=>x.tipo===S.filtro);
  itens.sort((a,b)=>(ativo(b)-ativo(a))||(b.valor-a.valor));
  const val=x=>isG?x.valor*parte(x,S.view,S.mes,d):+x.valor;

      <div style="min-width:0"><div class="d">${esc(x.descricao)}</div><div class="m">${meta}</div></div>
      <div class="v">${brl0(x.valor)}${f<1&&f>0?`<small>sua parte ${brl0(x.valor*f)}</small>`:''}${statusPill(x,at)}</div></button>`}).join('');

  ${itens.length?`<div class="list">${rows}</div>`:`<div class="card empty"><h3>Nenhum${isG?' gasto':'a renda'} aqui</h3><p style="margin:0">Use o botão Lançar para cadastrar.</p></div>`}
  <p class="hint" style="margin:0">Toque em um lançamento para editar ou excluir. Itens esmaecidos não pesam em ${mLabel(S.mes)}.</p>`;

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const kfmt=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(Math.round(v));
function chart(ps,W){
  const H=240,pl=42,pr=10,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(1,...ps.map(p=>Math.max(p.renda,p.gastos)));const st=niceStep(max/4);const top=Math.ceil(max*1.04/st)*st;
  const y=v=>pt+ih-(v/top)*ih,slot=iw/ps.length,bw=Math.min(30,slot*.58),every=slot<46?2:1;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Renda e gastos previstos por mês">`;
  for(let v=0;v<=top+1e-6;v+=st){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`}
  ps.forEach((p,i)=>{
    const x=pl+slot*i+(slot-bw)/2;let acc=0;
    [['fixos','--c1'],['parcelas','--c2'],['unicos','--c3']].forEach(([k,c])=>{const v=p[k];if(v<=0)return;const y0=y(acc),y1=y(acc+v);s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="var(${c})"><title>${mLabel(p.m)} · ${k}: ${brl0(v)}</title></rect>`;acc+=v});
    if(i%every===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" style="${p.sobra<0?'fill:var(--bad)':''}">${mShort(p.m)}</text>`;
    if(p.sobra<0)s+=`<circle cx="${x+bw/2}" cy="${y(p.gastos)-8}" r="3" fill="var(--bad)"/>`;
  });
  const pts=ps.map((p,i)=>`${pl+slot*i+slot/2},${y(p.renda)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="var(--hair)" stroke-width="1.5"/>`;
  ps.forEach((p,i)=>{s+=`<circle cx="${pl+slot*i+slot/2}" cy="${y(p.renda)}" r="2.5" fill="var(--bg)" stroke="var(--hair)" stroke-width="1.5"><title>${mLabel(p.m)} · renda: ${brl0(p.renda)}</title></circle>`});
  return s+'</svg>';
}
function viewProj(){
  const ps=proj(12),d=D();
  if(!ps.some(p=>p.renda||p.gastos))return vazioMes();
  const W=Math.max(340,Math.min(1048,($('#main').clientWidth||360)-32));
  let acc=0;const rows=ps.map((p,i)=>{acc+=p.sobra;return `<tr class="${i===0?'cur':''}"><td>${mLabel(p.m)}</td><td>${brl0(p.renda)}</td><td>${brl0(p.gastos)}</td><td>${brl0(p.parcelas)}</td><td class="${p.sobra<0?'neg':''}">${brl0(p.sobra)}</td><td class="${acc<0?'neg':''}">${brl0(acc)}</td></tr>`}).join('');
  const tot=ps.reduce((s,p)=>s+p.sobra,0),media=tot/12;
  const alivios=d.gastos.filter(g=>g.tipo==='parcelado'&&!g.observacao&&parte(g,S.view,S.mes,d)>0).map(g=>({g,fim:fimParcelas(g)}))
    .filter(x=>mDiff(S.mes,x.fim)>=0&&mDiff(S.mes,x.fim)<11).sort((a,b)=>a.fim.localeCompare(b.fim));
  const picos=ps.slice(1).flatMap(p=>p.itens.filter(i=>i.g.tipo==='unico').map(i=>({...i,m:p.m}))).sort((a,b)=>a.m.localeCompare(b.m));
  const negs=ps.filter(p=>p.sobra<0);

function fv(aporte,taxaAnual,meses){const i=Math.pow(1+taxaAnual/100,1/12)-1;return i?aporte*((Math.pow(1+i,meses)-1)/i):aporte*meses}
function simOut(){
  const d=D(),ap=S.simAporte??0,tx=+d.cfg.taxaAnual||0;
  return [12,36,60,120].map(n=>{const v=fv(ap,tx,n);return `<div><div class="y">${n/12} ${n===12?'ano':'anos'}</div><div class="v">${brl0(v)}</div><div class="i">investido ${brl0(ap*n)}</div></div>`}).join('');
}

/* ---------- Folha de lançamento ---------- */
let draft=null,sheetErr='',delArmed=false;
function openSheet(col,item){
  delArmed=false;sheetErr='';
  const pDef=S.view==='casal'?'casal':S.view;
  if(item)draft={col,...item,valor:fmtValor(item.valor)};
  else if(col==='gastos')draft={col,tipo:'fixo',descricao:'',valor:'',categoria:'mercado',pessoa:pDef,inicio:S.mes,fim:'',parcelas:10};
  else draft={col,tipo:'fixa',descricao:'',valor:'',pessoa:S.view==='b'?'b':'a',inicio:S.mes,fim:''};
  renderSheet();$('#scrim').hidden=false;$('#sheet').hidden=false;$('#fab').hidden=true;
  setTimeout(()=>{const f=$('#f_desc');if(f&&!item&&matchMedia('(min-width:860px)').matches)f.focus()},50);
}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true;$('#fab').hidden=S.tab==='ajustes';draft=null;if(S.pendingRender)render()}
function readSheet(){
  if(!draft)return;const g=id=>{const el=$('#'+id);return el?el.value:undefined};
  const map={f_desc:'descricao',f_valor:'valor',f_cat:'categoria',f_inicio:'inicio',f_fim:'fim',f_parc:'parcelas'};
  for(const[id,k]of Object.entries(map)){const v=g(id);if(v!==undefined)draft[k]=v}
}
function infoParcela(){
  if(draft.tipo!=='parcelado'||!okMonth(draft.inicio))return '';
  const n=parseInt(draft.parcelas)||0,v=parseValor(draft.valor);if(n<1)return '';
  const atual=mDiff(draft.inicio,S.mes)+1,fim=addM(draft.inicio,n-1);
  const quando=atual>=1&&atual<=n?`Em ${mLabel(S.mes)}: parcela <b>${atual} de ${n}</b>.`:atual<1?`Começa em ${mLabel(draft.inicio)}.`:`Terminou em ${mLabel(fim)}.`;
  return `${quando} Última em <b>${mLabel(fim)}</b>.${isFinite(v)&&v>0?` Total <b>${brl0(v*n)}</b>.`:''}`;
}
function renderSheet(){
  const isG=draft.col==='gastos',t=draft.tipo,editing=!!draft.id;
  const tipos=isG?[['fixo','Fixo mensal'],['parcelado','Parcelado'],['unico','Único']]:[['fixa','Fixa mensal'],['extra','Extra (um mês)']];
  const pessoas=isG?['casal','a','b']:['a','b'];
  const vLabel=isG?(t==='parcelado'?'Valor da parcela':t==='fixo'?'Valor por mês':'Valor'):(t==='fixa'?'Valor por mês':'Valor');
  const atual=t==='parcelado'&&okMonth(draft.inicio)?mDiff(draft.inicio,S.mes)+1:1;
  $('#sheet').innerHTML=`<div class="grab"></div><form id="sheetForm" novalidate>
    <div class="head"><h2 id="sheetTitle">${editing?'Editar':'Novo'} ${isG?'gasto':'renda'}</h2><button type="button" class="close" data-act="sheet-close" aria-label="Fechar">×</button></div>
    ${editing?'':`<div class="seg" role="group" aria-label="Gasto ou renda"><button type="button" data-act="sheet-col" data-v="gastos" aria-pressed="${isG}">Gasto</button><button type="button" data-act="sheet-col" data-v="rendas" aria-pressed="${!isG}">Renda</button></div>`}
    <div class="field"><span class="flabel">Tipo</span><div class="seg" role="group" aria-label="Tipo">${tipos.map(([k,l])=>`<button type="button" data-act="sheet-tipo" data-v="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div></div>
    <div class="field"><label for="f_desc">Descrição</label><input class="inp" id="f_desc" value="${esc(draft.descricao)}" placeholder="${isG?'Ex.: Aluguel, Mercado, Geladeira':'Ex.: Salário, Freelance'}" autocomplete="off"></div>
    <div class="f2">
      <div class="field"><label for="f_valor">${vLabel} (R$)</label><input class="inp money" id="f_valor" inputmode="decimal" value="${esc(draft.valor)}" placeholder="0,00"></div>
      ${isG?`<div class="field"><label for="f_cat">Categoria</label><select class="inp" id="f_cat">${CATS.map(c=>`<option value="${c.id}" ${draft.categoria===c.id?'selected':''}>${c.nome}</option>`).join('')}</select></div>`:'<div></div>'}
    </div>
    ${t==='parcelado'?`<div class="f2">
      <div class="field"><label for="f_parc">Nº de parcelas</label><input class="inp money" id="f_parc" inputmode="numeric" value="${esc(draft.parcelas)}"></div>
      <div class="field"><label for="f_atual">Parcela em ${mLabel(S.mes)}</label><input class="inp money" id="f_atual" inputmode="numeric" value="${atual}"></div>
    </div>
    <div class="field"><label for="f_inicio">Mês da 1ª parcela</label><input class="inp" type="month" id="f_inicio" value="${esc(draft.inicio)}"></div>
    <div class="hint" id="f_info">${infoParcela()}</div>`:''}
    ${t==='unico'||t==='extra'?`<div class="field"><label for="f_inicio">Mês</label><input class="inp" type="month" id="f_inicio" value="${esc(draft.inicio)}"></div>`:''}
    ${t==='fixo'||t==='fixa'?`<div class="f2"><div class="field"><label for="f_inicio">Desde</label><input class="inp" type="month" id="f_inicio" value="${esc(draft.inicio)}"></div>
      <div class="field"><label for="f_fim">Até (opcional)</label><input class="inp" type="month" id="f_fim" value="${esc(draft.fim||'')}"></div></div>`:''}
    <div class="field"><span class="flabel">${isG?'De quem é o gasto':'De quem é a renda'}</span><div class="seg" role="group" aria-label="Pessoa">${pessoas.map(p=>`<button type="button" data-act="sheet-pessoa" data-v="${p}" aria-pressed="${draft.pessoa===p}">${esc(nome(p))}</button>`).join('')}</div></div>
    ${isG?`<div class="field"><span class="flabel">Entra nas contas?</span><div class="seg" role="group" aria-label="Entra nas contas"><button type="button" data-act="sheet-obs" data-v="0" aria-pressed="${!draft.observacao}">Sim</button><button type="button" data-act="sheet-obs" data-v="1" aria-pressed="${!!draft.observacao}">Em observação</button></div>
      ${draft.observacao?'<div class="hint">Fica anotado, mas não pesa em nenhum mês até vocês definirem.</div>':''}</div>`:''}
    ${sheetErr?`<div class="err" role="alert">${esc(sheetErr)}</div>`:''}
    <div class="actions">
      ${editing?`<button type="button" class="btn danger ${delArmed?'armed':''}" data-act="sheet-del">${delArmed?'Confirmar exclusão':'Excluir'}</button>`:'<span></span>'}
      <button type="submit" class="btn">${editing?'Salvar alterações':'Salvar'}</button>
    </div></form>`;
}
async function submitSheet(){
  readSheet();const isG=draft.col==='gastos',v=parseValor(draft.valor);
  sheetErr='';
  if(!draft.descricao.trim())sheetErr='Escreva uma descrição.';
  else if(!(v>0))sheetErr='Informe um valor maior que zero.';
  else if(!okMonth(draft.inicio))sheetErr='Escolha o mês.';
  else if(draft.tipo==='parcelado'&&!(parseInt(draft.parcelas)>=2))sheetErr='Parcelado precisa de 2 parcelas ou mais.';
  else if(draft.fim&&okMonth(draft.fim)&&mDiff(draft.inicio,draft.fim)<0)sheetErr='O mês final vem antes do inicial.';
  if(sheetErr){renderSheet();return}
  const o={id:draft.id,descricao:draft.descricao.trim(),valor:Math.round(v*100)/100,tipo:draft.tipo,pessoa:draft.pessoa,inicio:draft.inicio};
  if(isG)o.categoria=draft.categoria;
  if(isG&&draft.observacao)o.observacao=true;
  if(draft.tipo==='parcelado')o.parcelas=parseInt(draft.parcelas);
  if((draft.tipo==='fixo'||draft.tipo==='fixa')&&okMonth(draft.fim))o.fim=draft.fim;
  if(!isG&&!['a','b'].includes(o.pessoa))o.pessoa='a';
  const editing=!!draft.id,col=draft.col;
  try{await gravar(col,o);if(!S.exemploOff){S.exemploOff=true;savePrefs()}closeSheet();toast(editing?'Alterações salvas':'Lançamento salvo')}
  catch(e){falha(e)}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act!=='apagar'&&S.wipeArmed){S.wipeArmed=false}
  switch(act){
    case 'tab':S.tab=v;try{history.replaceState(null,'','#'+v)}catch(_){}render();window.scrollTo(0,0);break;
    case 'mes':S.mes=addM(S.mes,+v);render();break;
    case 'hoje':S.mes=mesBase();render();break;
    case 'sair-planilha':sairPlanilha();break;
    case 'tema':S.tema=temaAtual()==='escuro'?'claro':'escuro';aplicarTema();savePrefs();render();break;
    case 'view':S.view=v;savePrefs();render();break;
    case 'lanc':S.lanc=v;S.filtro='mes';render();break;
    case 'filtro':S.filtro=v;render();break;
    case 'add':openSheet(S.tab==='lancamentos'?S.lanc:'gastos');break;
    case 'add-renda':openSheet('rendas');break;
    case 'edit':{
      if(isExemplo()){toast('Este é um lançamento de exemplo. Toque em Começar com nossos dados.');break}
      const it=S[b.dataset.col].find(x=>x.id===b.dataset.id);if(it)openSheet(b.dataset.col,it);break}
    case 'sheet-close':closeSheet();break;
    case 'sheet-col':readSheet();openSheet(v);break;
    case 'sheet-tipo':readSheet();draft.tipo=v;delArmed=false;renderSheet();break;
    case 'sheet-pessoa':readSheet();draft.pessoa=v;renderSheet();break;
    case 'sheet-obs':readSheet();draft.observacao=v==='1';renderSheet();break;
    case 'ver-obs':S.tab='lancamentos';S.lanc='gastos';S.filtro='obs';render();break;
    case 'sheet-del':
      if(!delArmed){readSheet();delArmed=true;renderSheet();break}
      try{await remover(draft.col,draft.id);closeSheet();toast('Lançamento excluído')}catch(err){falha(err)}break;
    case 'sair-exemplo':S.exemploOff=true;savePrefs();render();break;
    case 'ver-exemplo':S.exemploOff=false;savePrefs();S.tab='resumo';render();break;
    case 'divisao':S.cfg.divisao=v;salvarCfg();break;
    case 'copiar':{
      const txt=JSON.stringify({cfg:S.cfg,rendas:S.rendas,gastos:S.gastos});
      try{await navigator.clipboard.writeText(txt);toast('Dados copiados. Guarde em um lugar seguro.')}
      catch(_){const t=$('#importTxt');t.value=txt;t.focus();t.select();toast('Selecionei o texto: copie com Ctrl+C ou Copiar.')}break}
    case 'importar':{
      let x;try{x=JSON.parse($('#importTxt').value)}catch(_){toast('O texto colado não é uma cópia válida.');break}
      if(!x||!Array.isArray(x.rendas)||!Array.isArray(x.gastos)){toast('O texto colado não é uma cópia válida.');break}
      try{
        if(S.modo==='planilha'){if(x.cfg)S.cfg={...DEF_CFG,...x.cfg};await escrever('restaurar',{cfg:x.cfg?S.cfg:null,rendas:x.rendas,gastos:x.gastos})}
        else{
          if(x.cfg){S.cfg={...DEF_CFG,...x.cfg};if(store.db)await store.db.doc('config/casal').set({...S.cfg})}
          for(const r of x.rendas)await gravar('rendas',r);
          for(const g of x.gastos)await gravar('gastos',g);
          if(!store.db)saveLocal();
        }
        $('#importTxt').value='';S.exemploOff=true;savePrefs();render();toast(`Restaurados ${x.rendas.length} rendas e ${x.gastos.length} gastos`);
      }catch(err){falha(err)}break}
    case 'apagar':
      if(!S.wipeArmed){S.wipeArmed=true;render();break}
      S.wipeArmed=false;
      try{
        if(S.modo==='planilha')await escrever('apagar');
        else if(store.db){for(const r of [...S.rendas])await remover('rendas',r.id);for(const g of [...S.gastos])await remover('gastos',g.id);await store.db.doc('config/casal').delete()}
        else{S.rendas=[];S.gastos=[];S.cfg={...DEF_CFG};saveLocal()}
        S.cfg={...DEF_CFG};render();toast('Todos os dados foram apagados');
      }catch(err){falha(err)}break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='sheetForm'){e.preventDefault();submitSheet()}
  if(e.target.id==='loginForm'){e.preventDefault();const i=$('#senhaInp'),s=i.value.trim();i.blur();if(s)entrarPlanilha(s)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='simAporte'){const v=parseValor(t.value);S.simAporte=isFinite(v)?v:0;$('#simOut').innerHTML=simOut();return}
  if(!draft)return;
  if(t.id==='f_atual'){const n=parseInt(t.value);if(n>=1){draft.inicio=addM(S.mes,-(n-1));const f=$('#f_inicio');if(f)f.value=draft.inicio}}
  if(['f_parc','f_inicio','f_valor','f_atual'].includes(t.id)){readSheet();const i=$('#f_info');if(i)i.innerHTML=infoParcela();
    if(t.id==='f_inicio'){const a=$('#f_atual');if(a&&okMonth(draft.inicio))a.value=mDiff(draft.inicio,S.mes)+1}}
});
document.addEventListener('change',e=>{
  const t=e.target;const k=t.dataset.cfg;if(!k)return;
  if(t.dataset.num){const v=parseValor(t.value);if(!isFinite(v)||v<0){toast('Use apenas números.');t.value=k==='reserva'?fmtValor(S.cfg[k]):S.cfg[k];return}S.cfg[k]=v}
  else S.cfg[k]=t.value.trim().slice(0,30);
  t.blur();salvarCfg();
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.pendingRender&&!$('#main').contains(document.activeElement))render()},0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft)closeSheet()});
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.tab==='projecao')render()},200)});

boot();
</script>
</body></html>
